# nginx for the anvil docs: static files from the Starlight build, served under the base path.
# This is a TEMPLATE: the Dockerfile replaces __BASE__ with the build's base path ("/anvil", or "" for the root) and
# drops the lines marked "only-with-base" when the site lives at the root. Installed as /etc/nginx/nginx.conf.
#
# Runs as a numeric non-root user and works with a read-only root filesystem: every path nginx writes (pid, temp
# files) is under /tmp, which must be a writable tmpfs (podman run --read-only --tmpfs /tmp, or an emptyDir in k8s).
# TLS and HSTS belong to whatever is in front (Cloudflare + Traefik on anvil); this listens on plain HTTP :8080.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types text/css application/javascript application/json image/svg+xml text/plain;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # HTML always revalidates, so a new build shows up at once; everything else under the base caches for an hour.
    map $sent_http_content_type $page_expires {
        default      1h;
        ~^text/html  -1;
    }

    log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml text/plain application/xml
                    application/wasm;

    server {
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # Redirects stay relative (Location: /anvil/...), so they work behind any proxy and host name.
        absolute_redirect off;

        # Security headers. Locations below set caching with `expires` only (never add_header), so these are
        # inherited everywhere. Starlight inlines a small theme script and styles ('unsafe-inline'); Pagefind's
        # search runs WebAssembly ('wasm-unsafe-eval'). Nothing is loaded from other origins.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Liveness/readiness for Kubernetes or the container HEALTHCHECK.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # URLs never end in a slash (Astro's trailingSlash: 'never'): the docs' home is __BASE__, not __BASE__/.
        location = / { return 302 __BASE__; }                                                       # only-with-base
        location = __BASE__ { expires -1; try_files __BASE__/index.html =404; }                      # only-with-base

        # Fingerprinted build assets never change: cache for a year.
        location __BASE__/_astro/ {
            expires 1y;
            try_files $uri =404;
        }

        # Search index: fragment files are hashed, the entry files are not; an hour is a safe middle.
        location __BASE__/pagefind/ {
            expires 1h;
            try_files $uri =404;
        }

        # Pages are directories (foo/index.html), served at foo without a redirect; foo/ redirects (301, query kept) to
        # foo. HTML revalidates; everything else (favicon, images, sitemap) caches for an hour ($page_expires).
        location __BASE__/ {
            expires $page_expires;
            rewrite ^(.+)/$ $1 permanent;
            try_files $uri $uri/index.html =404;
        }

        # HTML always revalidates, so a new build shows up at once.
        location ~ \.html$ {
            expires -1;
        }

        error_page 404 __BASE__/404.html;
    }
}
